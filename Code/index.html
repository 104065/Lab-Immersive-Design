<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1.2 - The Interactive Gallery</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js">
    </script>
</head>

<body>
    <a-scene>
        <a-sky src="images/360image.jpg" rotation="0 -130 0"></a-sky>
            
            <a-text value="Hello World VR!" position="-1 1.5 -3"
                color="pink">
            </a-text>

        <a-entity camera look-controls>
            <a-entity cursor="rayOrigin: mouse;" position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.02;
            radiusOuter: 0.03"
                material="color: black; shader: flat">
            
            
            </a-entity>
        </a-entity>

        <a-box id="mijnKubus" position="-2 1 -4" color="darkblue" interactief-object></a-box>
        <a-sphere id="mijnBol" position="2 1 -4" color="darkred" interactief-object></a-sphere>
        

    </a-scene>
<script src="app.js">
</script>
</body>
</html>
